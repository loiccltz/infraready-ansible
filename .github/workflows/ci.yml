---
name: CI Ansible

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: Validation du depot (YAML, lint, syntaxe des playbooks)
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils (versions figees)
        run: python -m pip install -r requirements-ci.txt

      - name: Installer les collections Ansible (versions figees)
        run: ansible-galaxy collection install -r requirements.yml

      - name: Verifier la syntaxe YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint

      - name: Verifier la syntaxe de chaque playbook
        run: |
          for pb in nginx.yml c-linux.yml f-supervision.yml maintenance.yml windows.yml windows-exporter.yml; do
            ansible-playbook -i inventory.ini "$pb" --syntax-check
          done
